# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "plasquid_workflow"
description: Run the plasquid analysis chain (replicon, RNA, incompatibility-group and mobilisation-gene searches) on plasmid representative sequences and extract a combined plasmid feature table
keywords:
  - plasmid
  - plasquid
  - replicon
  - mobilisation
components:
  - map_protein_to_contig
  - repsearch
  - rnasearch
  - incsearch
  - mobsearch
  - extract_plasmids_data
input:
  - plasmids_fna:
      type: file
      description: |
        Plasmid cluster representative nucleotide sequences
        Structure: [ val(meta), path(fasta) ]
  - plasmids_faa:
      type: file
      description: |
        Plasmid cluster representative protein sequences
        Structure: [ val(meta), path(fasta) ]
  - plasmids_gff:
      type: file
      description: |
        Plasmid cluster representative GFF, source of the protein-id -> (renamed)
        contig-id crosswalk (protein ids keep their original pre-rename form; the
        matching nucleotide contig has since been renamed, so it can't be recovered
        from the protein id's own text)
        Structure: [ val(meta), path(gff) ]
output:
  - fasta:
      type: file
      description: |
        Nucleotide sequences of every contig with at least one plasmid-evidence hit
        Structure: [ val(meta), path(fasta) ]
  - report:
      type: file
      description: |
        Per-contig RIP_domain/MOB_group/Inc_group/contig_length report
        Structure: [ val(meta), path(tsv) ]
  - rip_seqs:
      type: file
      description: |
        Protein sequences of every accepted replication initiator protein (RIP) call
        Structure: [ val(meta), path(fasta) ]
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
authors:
  - "@KateSakharova"
maintainers:
  - "@KateSakharova"
