# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "proteins_subwf"
description: Chunk and functionally annotate representative protein sequences (AMR detection, optional phamily assortment, HMM-based annotation) and summarise the results
keywords:
  - proteins
  - annotation
  - amr
  - hmmer
  - phammseqs
components:
  - seqkit/split2
  - amr_annotation
  - phammseqs
  - hmmer/hmmsearch
  - find/concatenate
  - summarise_annotations
input:
  - input:
      type: file
      description: |
        Representative proteins joined with their GFF
        Structure: [ val(meta), path(reps_faa_uncompressed), path(reps_gff) ]
output:
  - hmmer_tables:
      type: file
      description: |
        Concatenated per-database HMMER annotation tables, collected into a single list
        Structure: [ val(meta), [ path(table), ... ] ]
  - amr_gff:
      type: file
      description: |
        GFF of antimicrobial-resistance gene annotations (AMRFinderPlus/deepARG/RGI)
        Structure: [ val(meta), path(gff) ]
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
authors:
  - "@KateSakharova"
maintainers:
  - "@KateSakharova"
