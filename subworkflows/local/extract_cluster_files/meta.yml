# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "extract_cluster_files"
description: Extract per-cluster-representative FNA, FAA, GFF and stats files from a full combined dataset, given a clustering table
keywords:
  - clustering
  - representatives
  - extraction
components:
  - extract_reps_stats
  - gunzip
  - seqtk/subseq
input:
  - clusters_tsv:
      type: file
      description: |
        Cluster assignment table from the clustering subworkflow
        Structure: [ val(meta), path(tsv) ]
  - gff:
      type: file
      description: Combined (filtered) GFF covering all input sequences
  - mapfile:
      type: file
      description: Rename map TSV produced by rename_contigs.py
  - sequences:
      type: file
      description: |
        Combined (filtered) nucleotide FASTA covering all input sequences
        Structure: [ val(meta), path(fasta) ]
  - faa:
      type: file
      description: Combined (filtered) protein FASTA covering all input sequences
  - type:
      type: string
      description: Category label used to tag the protein extraction step, e.g. 'viruses' or 'plasmids'
output:
  - reps_fna_uncompressed:
      type: file
      description: |
        Decompressed nucleotide FASTA for cluster representatives
        Structure: [ val(meta), path(fasta) ]
  - reps_faa_uncompressed:
      type: file
      description: |
        Decompressed protein FASTA for cluster representatives
        Structure: [ val(meta), path(fasta) ]
  - reps_fna_compressed:
      type: file
      description: |
        Gzip-compressed nucleotide FASTA for cluster representatives
        Structure: [ val(meta), path(fasta.gz) ]
  - reps_faa_compressed:
      type: file
      description: |
        Gzip-compressed protein FASTA for cluster representatives
        Structure: [ val(meta), path(fasta.gz) ]
  - reps_gff:
      type: file
      description: |
        GFF records for cluster representatives only
        Structure: [ val(meta), path(gff) ]
  - reps_list:
      type: file
      description: |
        One representative sequence ID per line
        Structure: [ val(meta), path(tsv) ]
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
authors:
  - "@KateSakharova"
maintainers:
  - "@KateSakharova"
