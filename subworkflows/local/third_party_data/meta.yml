# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "third_party_data"
description: Integrate non-MGnify inputs (viruses and plasmids) sample sheet for third-party data sources.
keywords:
  - third-party data
  - validation
  - fasta
  - plasmids
  - virus
components:
  - falint
  - pyrodigal
  - gunzip
input:
  - meta:
      type: map
      description: Sample metadata with at minimum an 'id' field
  - fasta:
      type: file
      description: FASTA file containing nucleotide sequences
      pattern: "*.{fa,fasta,fna}"
output:
  - fna:
      type: file
      description: Gene nucleotide sequences (decompressed)
      pattern: "*.fna"
  - faa:
      type: file
      description: Predicted amino acid sequences (decompressed)
      pattern: "*.faa.gz"
  - gff:
      type: file
      description: Gene annotations in GFF format (decompressed)
      pattern: "*.gff"
authors:
  - "@EfraMP"
maintainers:
  - "@EfraMP"
