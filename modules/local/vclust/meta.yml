name: vclust
description: Cluster viral genome sequences based on Average Nucleotide Identity (ANI) using the Vclust tool
keywords:
  - clustering
  - ANI
  - viral
tools:
  - vclust:
      description: |
        Vclust is a tool for fast and accurate clustering of viral genome sequences based on ANI.
        It performs deduplication, prefiltering, pairwise alignment, and clustering using the Leiden algorithm.
      homepage: https://github.com/refresh-bio/vclust
      documentation: https://github.com/refresh-bio/vclust
      licence: ["GPL-3.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - fasta:
        type: file
        description: FASTA file with viral genome sequences to cluster
        pattern: "*.{fa,fasta,fna}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
  - - ani_threshold:
        type: number
        description: Minimum ANI threshold for clustering (value between 0 and 1)
        ontologies: []
  - - coverage_threshold:
        type: number
        description: Minimum coverage threshold for clustering (value between 0 and 1)
        ontologies: []
output:
  clusters_tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - clusters_tsv:
          type: file
          description: TSV file with cluster assignments and representative sequences
          pattern: "*_clusters.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@KateSakharova"
maintainers:
  - "@KateSakharova"
