# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: update_mobility_stats
description: Recompute plaSquid's mobility_stats.json using MOB-suite's biomarker report as the missing mating-pair-formation (MPF) evidence
keywords:
  - plasmid
  - plasquid
  - mobsuite
  - mobility
tools:
  - update_mobility_stats:
      description: |
        Local script (update_mobility_stats.py) that promotes every contig
        plaSquid classified "mobilizable" (has a relaxase/MOB hit, no MPF
        evidence) to "conjugative" wherever MOB-suite's biomarker report also
        found a mate-pair-formation hit on that contig, then re-derives
        mobility_stats.json's summary counts/percentages from the updated
        per-contig classification. non_mobilizable contigs are never
        promoted (MPF alone doesn't establish a relaxase is present)
      homepage: ""
      documentation: ""
      licence: []
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'plasmids' ]
    - mobility_classification:
        type: file
        description: plaSquid's per-contig mobility classification (PLASQUID_WORKFLOW.out.mobility_classification)
        pattern: "mobility_classification.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - mobility_json:
        type: file
        description: plaSquid's aggregate mobility summary (PLASQUID_WORKFLOW.out.mobility_stats), used for a total_contigs sanity check
        pattern: "mobility_stats.json"
        ontologies: []
    - biomarker_report:
        type: file
        description: |
          MOB-suite's plasmids_biomarker_report.txt (mob_typer
          --biomarker_report_file), or `[]` to skip promotion (output then
          equals plaSquid's own classification, unchanged)
        pattern: "*_biomarker_report.txt"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
output:
  mobility_stats:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "mobility_stats_final.json":
          type: file
          description: Summary counts/percentages per mobility class, with a real (non-zero-capped) conjugative count when MOB-suite MPF evidence was supplied
          pattern: "mobility_stats_final.json"
          ontologies: []
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@KateSakharova"
maintainers:
  - "@KateSakharova"
