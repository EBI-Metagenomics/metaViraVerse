---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# Note: CRISPRCasFinder itself is only available via Docker/Singularity container
# This environment file specifies Python for the post-processing script
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.12
  - bioconda::biopython=1.75
