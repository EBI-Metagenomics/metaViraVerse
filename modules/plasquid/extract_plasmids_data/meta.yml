# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: extract_plasmids_data
description: Combine REPSEARCH/INCSEARCH/MOBSEARCH's plasmid-evidence tables into one per-contig report and extract the reported contigs' and RIPs' sequences
keywords:
  - plasmid
  - plasquid
  - replicon
  - mobilisation
  - incompatibility
tools:
  - extract_plasmids_data:
      description: |
        Local scripts (plasquid_retrieve_rip_plasmids.R, plasquid_rip_extraction.R)
        that join REPSEARCH/INCSEARCH/MOBSEARCH's independent per-contig calls into
        one report and pull out the corresponding nucleotide/protein sequences
      homepage: https://github.com/mgimenez720/plaSquid
      documentation: https://github.com/mgimenez720/plaSquid
      licence: []
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'plasmids' ]
    - filt_classification:
        type: file
        description: INCSEARCH's filtered Inc-group classification table
        pattern: "filtered_classif.tsv"
        ontologies: []
    - mob_table:
        type: file
        description: MOBSEARCH's accepted MOB hits table
        pattern: "mob_table.tsv"
        ontologies: []
    - rep_domains:
        type: file
        description: REPSEARCH's accepted RIP calls table
        pattern: "rep_domains.tsv"
        ontologies: []
    - fna:
        type: file
        description: Plasmid cluster representative nucleotide sequences
        pattern: "*.{fna,fasta}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
    - faa:
        type: file
        description: Plasmid cluster representative protein sequences
        pattern: "*.{faa,fasta}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
output:
  fasta:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "plasmids_contigs.fasta":
          type: file
          description: Nucleotide sequences of every contig with at least one plasmid-evidence hit
          pattern: "plasmids_contigs.fasta"
          ontologies:
            - edam: http://edamontology.org/format_1929 # FASTA
  report:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "plasmid_report.tsv":
          type: file
          description: Per-contig RIP_domain/MOB_group/Inc_group/contig_length report
          pattern: "plasmid_report.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  protein_report:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "protein_report.tsv":
          type: file
          description: |
            Per-protein counterpart to plasmid_report.tsv (Contig, Protein,
            RIP_domain, MOB_group, Inc_group) -- one row per protein with at
            least one hit from REPSEARCH, MOBSEARCH or INCSEARCH
          pattern: "protein_report.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  rip_seqs_faa:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "rip_seqs.faa":
          type: file
          description: Protein sequences of every accepted RIP call
          pattern: "rip_seqs.faa"
          ontologies:
            - edam: http://edamontology.org/format_1929 # FASTA
  mobility_stats:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "mobility_stats.json":
          type: file
          description: |
            Contig counts/percentages per mobility class (conjugative,
            mobilizable, non_mobilizable). plaSquid detects the MOB relaxase
            gene only, not MPF/T4SS conjugation machinery, so "conjugative"
            stays at 0 unless independent MPF evidence is supplied -- see
            plasquid_rip_extraction.R's header comment
          pattern: "mobility_stats.json"
          ontologies:
            - edam: http://edamontology.org/format_3464 # JSON
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@KateSakharova"
maintainers:
  - "@KateSakharova"
