repository_type: pipeline

nf_core_version: 3.3.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-viraverse_logo_light.png
    - docs/images/nf-core-viraverse_logo_light.png
    - docs/images/nf-core-viraverse_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .github/CONTRIBUTING.md
    - .prettierignore
    - .prettierignore
    - .prettierignore
    - .prettierignore
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-viraverse_logo_light.png
    - docs/images/nf-core-viraverse_logo_light.png
    - docs/images/nf-core-viraverse_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - CITATIONS.md
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - conf/igenomes.config
    - conf/igenomes_ignored.config
  readme:
    - nextflow_badge
    - nfcore_template_badge

template:
  org: EBI-Metagenomics
  name: viraverse
  description: Viral catalogue generation pipeline
  author: KateSakharova
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github_badges
    - igenomes
    - fastqc
    - seqera_platform
    - gpu
    - gitpod
    - codespaces
    - vscode
    - citations
    - rocrate
    - email
    - adaptivecard
    - slackreport
  is_nfcore: false
